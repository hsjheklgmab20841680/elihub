<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Başkentler" />
  <title>Ülkeler & Başkentleri</title>
  <style>
    :root {
      --bg-page: #f5f7ff;
      --bg-card: #ffffff;
      --bg-subtle: #f1f4ff;
      --bg-header: #ffffff;
      --text-main: #181c32;
      --text-muted: #6e7694;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border: #e4e8f5;
      --border-input: #4f46e5;
      --danger: #ef4444;
      --success: #16a34a;
      --shadow: 0 12px 32px rgba(24, 28, 50, 0.06);
    }

    body.dark {
      --bg-page: #0f1322;
      --bg-card: #181e34;
      --bg-subtle: #202844;
      --bg-header: #151a2e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --border: #283152;
      --border-input: #6366f1;
      --danger: #f87171;
      --success: #4ade80;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .topbar {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:hover {
      background: var(--bg-subtle);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: transparent;
      width: 100%;
      justify-content: center;
      padding: 14px 20px;
      font-size: 15px;
      border-radius: 12px;
      margin-top: 14px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .main-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px 12px;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 20px;
      box-shadow: var(--shadow);
    }

    @media (min-width: 640px) {
      .card {
        padding: 28px 32px;
      }
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .lives-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .hearts {
      display: flex;
      gap: 4px;
      font-size: 17px;
      color: var(--danger);
    }

    .heart.lost {
      opacity: 0.22;
      filter: grayscale(1);
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-switch {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .counter-pill {
      background: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: var(--bg-subtle);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.25s ease;
    }

    .prompt-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .prompt-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .country-name {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .prompt-hint {
      font-size: 13px;
      color: var(--text-muted);
    }

    .input-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .answer-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text-main);
      background: var(--bg-card);
      border: 2px solid var(--border-input);
      border-radius: 12px;
      outline: none;
    }

    .answer-input::placeholder {
      color: var(--text-muted);
    }

    .feedback {
      margin-top: 10px;
      min-height: 20px;
      font-size: 13.5px;
      font-weight: 600;
    }

    .feedback.ok {
      color: var(--success);
    }

    .feedback.err {
      color: var(--danger);
    }

    .stats-row {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .stat-ok strong {
      color: var(--success);
    }

    .stat-err strong {
      color: var(--danger);
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 14px 16px 20px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 28, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 540px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .modal p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .modal textarea {
      width: 100%;
      height: 200px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 13.5px;
      line-height: 1.5;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .summary-box {
      text-align: center;
      padding: 12px 0 4px;
    }

    .summary-box h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .summary-box p {
      color: var(--text-muted);
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🌐</div>
      <div>
        <div class="brand-title">Ülkeler & Başkentleri</div>
        <div class="brand-sub" id="listSubtitle">Varsayılan Dünya Listesi (45 ülke)</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" type="button" id="themeBtn" onclick="toggleTheme()">🌙 Koyu Mod</button>
      <button class="btn" type="button" onclick="openEditor()">+ Listeyi Düzenle</button>
      <button class="btn" type="button" onclick="resetGame()">↻ Yeniden Başla</button>
    </div>
  </header>

    <section class="card" id="gameCard">
      <div class="card-top">
        <div class="lives-box">
          <span>CAN</span>
          <div class="hearts" id="heartsBox"></div>
        </div>

        <div class="right-controls">
          <div class="mode-switch">
